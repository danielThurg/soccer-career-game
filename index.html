<style>
:root{--ink:#2B1D14;--brown:#4B3527;--paper:#FFFDF8;--bg:#FFF7EC;--cream:#FFF0CD;--line:#DDB98E;--line2:#EAD3B0;--muted:#7A5A3A;--gold:#F0C253;--sage:#86AD78;--blue:#438BC0;--rose:#DF9287;--pitch:#7FA077;--pitch2:#89AA80;--acc:#FFF0CD;--accfg:#2B1D14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:13px;overflow:hidden;-webkit-user-select:none;user-select:none}
button,select{font-family:inherit;color:var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{flex:none;height:46px;display:flex;align-items:center;gap:9px;padding:0 10px;border-bottom:2px solid var(--ink);background:var(--acc);color:var(--accfg)}
.top h1{margin:0;font-size:16px;line-height:1;white-space:nowrap}
.top small{display:block;font-size:10px;font-weight:800;opacity:.85;white-space:nowrap}
.chips{flex:1;display:flex;gap:6px;justify-content:flex-end;overflow:hidden}
.chip{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;padding:2px 9px;line-height:1.1;white-space:nowrap}
.chip b{display:block;font-size:12px}.chip span{font-size:9px;font-weight:700;color:var(--muted)}
.bell{position:relative;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper);font-size:16px;cursor:pointer;flex:none}
.bell i{position:absolute;top:-6px;right:-6px;background:#E34B3F;color:#fff;font-style:normal;font-weight:800;font-size:10px;border-radius:99px;min-width:17px;height:17px;line-height:17px;text-align:center}
.scr{flex:1;min-height:0;overflow:auto;padding:8px 10px;-webkit-overflow-scrolling:touch}
.nav{flex:none;height:calc(52px + env(safe-area-inset-bottom));padding:5px 8px env(safe-area-inset-bottom);background:var(--brown);border-top:2px solid var(--ink);display:flex;justify-content:center;gap:6px}
.nav button{flex:1;max-width:150px;border:1.5px solid transparent;border-radius:11px;background:transparent;color:#ECDCC7;font-weight:800;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{box-shadow:0 3px 0 #301E16;border-color:#FFEFD0}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:9px}
.card h3{margin:0 0 5px;font-size:14px}
.btn{min-height:38px;padding:0 12px;border-radius:11px;border:2px solid var(--ink);background:var(--paper);font-weight:800;font-size:12.5px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--accfg);box-shadow:0 3px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.big{width:100%;min-height:46px;font-size:16px;margin-top:6px}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.sm{min-height:30px;padding:0 9px;font-size:11.5px}
.btn.ico{padding:0 7px;min-height:28px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:99px;white-space:nowrap}
.meter{height:8px;border-radius:4px;background:var(--line2);border:1.5px solid var(--ink);overflow:hidden}
.meter i{display:block;height:100%}
.ml{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-top:4px}
.g3{display:grid;grid-template-columns:28% 1fr 29%;gap:9px;height:100%}
.g2{display:grid;grid-template-columns:42% 1fr;gap:9px;height:100%}
.g3t{display:grid;grid-template-columns:27% 1fr 24%;gap:9px;height:100%}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.pitch{position:relative;border:2px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(90deg,var(--pitch) 0 9%,var(--pitch2) 9% 18%);overflow:hidden}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.tk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;cursor:pointer;z-index:2}
.tk .h{width:38px;height:38px;border-radius:50%;overflow:hidden;border:3px solid var(--sage);background:var(--line2);display:block}
.tk .h svg{width:100%;height:100%;display:block}
.tk .n{background:var(--ink);color:var(--cream);font-size:9.5px;font-weight:800;padding:0 6px;border-radius:99px;white-space:nowrap}
.tk.sel .h{box-shadow:0 0 0 3px var(--ink);border-color:var(--cream)}

.hd{border-radius:50%;overflow:hidden;background:var(--line2);border:2px solid var(--ink);flex:none}

.prow{display:flex;align-items:center;gap:8px;padding:5px 7px;border:2px solid var(--line2);border-radius:12px;background:var(--paper);cursor:pointer;min-width:0;flex:none}
.prow.sel{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}

.fig{width:84px;height:130px;flex:none;background:#F3E0B0;border-radius:10px;overflow:hidden}

.srow{display:grid;grid-template-columns:62px 1fr 24px;gap:5px;align-items:center;font-size:11px;font-weight:800;margin:2px 0}

.seg{display:flex;gap:3px}

.bdg{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--ink);flex:none;color:#fff;font-weight:800;text-shadow:0 1px 0 #2B1D14,1px 0 0 #2B1D14,-1px 0 0 #2B1D14,0 -1px 0 #2B1D14}

.fm.V{background:var(--sage)}.fm.N{background:var(--gold)}.fm.D{background:var(--rose)}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:6px 0 2px}

.pips{display:inline-flex;gap:2px;vertical-align:middle}.pips i{width:9px;height:9px;border-radius:3px;border:1.5px solid var(--ink);background:var(--line2)}.pips i.on{background:var(--gold)}
.swrap{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:28px;height:28px;border-radius:9px;border:2px solid var(--ink);cursor:pointer;padding:0}

.frow{display:flex;align-items:center;gap:7px;padding:4px 0;border-top:1.5px solid var(--line2)}
.ov{position:fixed;inset:0;background:rgba(43,29,20,.74);z-index:20;display:flex;align-items:center;justify-content:center;padding:8px}
.md{background:var(--bg);border:2px solid var(--ink);border-radius:16px;padding:10px;width:min(800px,100%);max-height:100%;overflow:auto}
.sbx{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(43,29,20,.88);color:var(--cream);border-radius:12px;padding:3px 10px;z-index:3;white-space:nowrap}
.sbx .s{font-size:22px;font-weight:800;min-width:24px;text-align:center}
.feed{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700}
.feed div{padding:3px 7px;border-radius:8px;background:var(--paper);border:1.5px solid var(--line2)}
.feed .g{background:var(--gold);border-color:var(--ink)}

table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 3px;border-top:1.5px solid var(--line2);text-align:right;font-weight:800}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{background:var(--cream)}
.cal1 td,.cal1 th{padding:2px 3px}
.evr{display:grid;grid-template-columns:42px 90px 1fr 56px;gap:6px;align-items:center;padding:3px 4px;border-radius:8px;font-size:12px;font-weight:800;border:1.5px solid transparent}
.evr.cur{border-color:var(--ink);background:var(--cream)}
.cc{flex:none;width:150px;display:flex;flex-direction:column;gap:5px}
.ch2{font-weight:800;font-size:11.5px;text-align:center;background:var(--ink);color:var(--cream);border-radius:8px;padding:3px}
.tie{border:2px solid var(--line);border-radius:9px;background:var(--paper);font-size:10.5px;font-weight:800;overflow:hidden}
.tie.me{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.tie>div{display:flex;justify-content:space-between;padding:2px 6px;gap:4px}.tie>div.w{background:#D7E2CF}.tie small{display:block;text-align:center;color:var(--muted);padding-bottom:2px}
.bub{max-width:84%;padding:7px 10px;border-radius:14px;font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--paper);line-height:1.25}
.bub.me{align-self:flex-end;background:var(--gold)}
.bub.sum{align-self:center;background:var(--cream);font-size:11px;border-style:dashed}
.chbtn{text-align:left;padding:7px 10px;border:2px solid var(--ink);border-radius:12px;background:var(--cream);font-weight:800;font-size:12.5px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:6px 14px;border-radius:99px;font-weight:800;font-size:12px;z-index:60;white-space:nowrap;max-width:90vw}
.rot{display:none;position:fixed;inset:0;z-index:50;background:var(--brown);color:var(--cream);align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px;font-weight:800;font-size:16px}
@media (orientation:portrait) and (max-width:700px){.rot.show{display:flex}}
@media (max-height:420px){.fig{width:70px;height:110px}}
[hidden]{display:none!important}button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.menu-button{border:1.5px solid #2b1d1440;border-radius:12px;background:#fffdf899;min-height:40px;padding:0 12px;font-weight:800;cursor:pointer}
.launcher{position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:1fr 1fr;align-items:center;overflow:auto;gap:40px;padding:clamp(24px,6vw,96px);background:radial-gradient(ellipse at 70% 20%,#b5cfaa55,transparent 55%),#fff2d7}
.launcher:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 7px,#4b352703 7px 8px)}
.launch-copy{max-width:520px;z-index:1}.launch-kicker{font-size:11px;font-weight:800;letter-spacing:.22em;color:#6a7850;margin:0 0 22px;display:flex;align-items:center;gap:10px}.launch-kicker:before{content:'';width:26px;height:3px;background:#6a7850}
.launch-title{font-size:clamp(52px,7vw,100px);font-weight:900;line-height:.92;letter-spacing:-.065em;margin:0;color:var(--brown)}.launch-title span{display:block;color:#658759;-webkit-text-stroke:1px var(--brown)}
.launch-tag{font-size:clamp(19px,2.4vw,27px);font-weight:800;margin:24px 0 12px}.launch-desc{font-size:15px;color:var(--muted);line-height:1.7;margin:0 0 25px;max-width:360px}
.launch-play{width:min(100%,340px);min-height:62px;border:2.5px solid var(--ink);border-radius:18px;background:var(--gold);box-shadow:0 5px 0 var(--ink);font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:space-between;padding:0 23px;cursor:pointer}.launch-play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.launch-save{font-size:12px;color:var(--muted);margin:15px 0 24px}.launch-options{display:flex;gap:10px;flex-wrap:wrap}.launch-options button{border:1.5px solid #bca584;background:#fffdf888;border-radius:12px;min-height:42px;padding:8px 14px;cursor:pointer;font-weight:800;font-size:12px}
.launch-art{position:relative;aspect-ratio:1;max-width:540px;width:100%;justify-self:center;transform:rotate(-4deg);border:3px solid var(--brown);border-radius:42px;background:repeating-linear-gradient(90deg,#7fa077 0 14%,#89aa80 14% 28%);box-shadow:9px 10px 0 #4b3527;overflow:hidden}
.launch-lines{position:absolute;inset:8%;border:2px solid #fffbdf8c;border-radius:3px}.launch-lines:before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:#fffbdf8c}.launch-lines:after{content:'';position:absolute;left:35%;top:35%;width:30%;height:30%;border:2px solid #fffbdf8c;border-radius:50%}
.launch-players{position:absolute;inset:12% 8% 3%;display:flex;align-items:flex-end;justify-content:center}.launch-player{width:36%;height:90%;filter:drop-shadow(0 8px 0 #2b1d1429)}.launch-player:nth-child(2){height:105%;margin:0 -6%;z-index:1}.launch-player svg{width:100%;height:100%}
.launch-badge{position:absolute;top:18px;left:18px;border:2px solid var(--brown);border-radius:30px;background:var(--cream);padding:7px 15px;font-size:12px;font-weight:900;transform:rotate(4deg)}.launch-caption{z-index:2;position:absolute;bottom:20px;left:50%;transform:translateX(-50%) rotate(4deg);white-space:nowrap;border:2px solid var(--ink);background:var(--paper);padding:9px 18px;border-radius:12px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.launch-help{margin-top:18px;background:var(--paper);border:1.5px solid var(--line);border-radius:15px;padding:16px;font-size:13px;line-height:1.7;max-width:420px}.launch-help p{margin:0 0 8px}.launch-help p:last-child{margin:0}.launch-help strong{color:var(--brown)}
.launch-footer{font-size:10px;letter-spacing:.14em;color:#8a6b4e;margin-top:30px}
@media(max-width:760px){.launcher{grid-template-columns:1fr;gap:28px;padding:30px 24px;text-align:center;align-content:start}.launch-copy{order:2;max-width:none}.launch-art{order:1;max-width:260px;border-radius:26px;box-shadow:5px 6px 0 var(--brown)}.launch-kicker{justify-content:center;font-size:10px;margin-bottom:14px}.launch-title{font-size:54px}.launch-desc{margin:0 auto 20px;font-size:13px}.launch-tag{font-size:20px;margin-top:16px}.launch-play{margin:auto;min-height:56px}.launch-save{margin-bottom:16px}.launch-options{justify-content:center}.launch-footer{margin-top:20px}.launch-help{margin:18px auto 0;text-align:left}.launch-caption{font-size:11px;bottom:10px;padding:6px 12px}.launch-badge{font-size:10px;top:10px;left:10px;padding:5px 10px}}
@media(max-height:500px) and (orientation:landscape){.launcher{grid-template-columns:1fr 1fr;padding:22px 7%;gap:30px;text-align:left}.launch-copy{order:0}.launch-art{order:0;max-width:300px}.launch-kicker{justify-content:flex-start;margin-bottom:12px}.launch-title{font-size:48px}.launch-tag{font-size:18px;margin:14px 0 8px}.launch-desc{font-size:12px;line-height:1.4;margin:0 0 14px}.launch-play{min-height:46px;font-size:16px}.launch-save{margin:10px 0}.launch-options{justify-content:flex-start;gap:6px}.launch-options button{min-height:34px;padding:5px 9px;font-size:10px}.launch-footer{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.menu-button{flex:none;min-height:34px}
</style>

<div id="ovl" hidden></div>

<main id="launcher" class="launcher" aria-label="Menu principal">
 <section class="launch-copy"><p class="launch-kicker">LE FOOT, À TA FAÇON · 7 CONTRE 7</p><h1 class="launch-title">SOCCER<span>CAREER</span></h1><p class="launch-tag">Ton club. Ton histoire.</p><p class="launch-desc">Prépare ton équipe, révèle ses talents et mène Nordville jusqu’au titre.</p><button class="launch-play" id="launch-play"><span id="launch-label">Entrer dans le club</span><span aria-hidden="true">→</span></button><p class="launch-save" id="launch-save"></p><div class="launch-options"><button id="launch-how" aria-expanded="false">Comment jouer</button><button id="launch-install" aria-expanded="false">Installer le jeu</button><button id="launch-fullscreen">Plein écran</button></div><div id="launch-help" class="launch-help" hidden></div><p class="launch-footer">NORDVILLE · UNE ÉQUIPE, MILLE POSSIBILITÉS</p></section>
 <div class="launch-art" aria-hidden="true"><div class="launch-lines"></div><div class="launch-badge">★ NORDVILLE ATHLETIC</div><div class="launch-players" id="launch-players"></div><div class="launch-caption">À toi de jouer, coach.</div></div>
</main>
<script>
'use strict';
/* Chibi renderer. Modes: full | head | bust | rig.
   p: {num,build,look{skin,hair,hc,beard,bc,gray,band,scar,freck},kit[2],kitStyle,eye,ear,pos,captain,inj}
   rig mode returns an SVG with groups .legL .legR .armL .armR .torso .head that can be rotated.
   Left parts rotate positive to swing outward, right parts negative. */
const INK = '#2B1D14';
function chibi(p, mode, mood) {
  mode = mode || 'full'; mood = mood || 'neutral';
  const b = p.build || 1, L = p.look, kit = p.kit || ['#C46A55', '#FFF0CD'];
  const hr = 20 + (b - 0.75) * 9, hy = 44, cx = 50, ry = 25;
  const tw = 15 + (b - 0.75) * 17, legW = 10 + (b - 0.75) * 4, armW = 9 + (b - 0.75) * 4;
  const hc = L.hc, sk = L.skin;
  const st = 'stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
  const st18 = st.replace('2.4', '1.8');
  let back = '', legL = '', legR = '', armL = '', armR = '', torso = '', head = '';
  if (L.hair === 'afro') back += '<circle cx="50" cy="' + (hy - 6) + '" r="' + (hr + 9) + '" fill="' + hc + '" ' + st + '/>';
  if (L.hair === 'long') back += '<path d="M' + (cx - hr - 3) + ' ' + (hy - 8) + ' Q' + (cx - hr - 7) + ' ' + (hy + 30) + ' ' + (cx - hr + 4) + ' ' + (hy + 36) + ' L' + (cx + hr - 4) + ' ' + (hy + 36) + ' Q' + (cx + hr + 7) + ' ' + (hy + 30) + ' ' + (cx + hr + 3) + ' ' + (hy - 8) + 'Z" fill="' + hc + '" ' + st + '/>';
  const lx = cx - legW - 3, rx = cx + 3;
  const leg = (x) => '<rect x="' + x + '" y="124" width="' + legW + '" height="26" rx="4" fill="' + sk + '" ' + st + '/><rect x="' + x + '" y="136" width="' + legW + '" height="14" rx="3" fill="' + kit[0] + '" ' + st + '/><ellipse cx="' + (x + legW / 2) + '" cy="152" rx="9" ry="4" fill="' + INK + '"/>';
  legL = leg(lx); legR = leg(rx);

function ovPress() {
  const pr = G.presser, cur = UI.pq || 0, q = pr.qs[cur], done = pr.res[cur];
  const bubble = '<div class="row" style="align-items:flex-end;gap:8px"><div style="width:70px;height:78px;background:#CFE3E8;border-radius:12px;overflow:hidden;flex:none">' + chibi(JOURN, 'bust', 'focus') + '</div><div class="bub" style="font-size:14px">🎤 ' + q.q + '</div></div>';
  let ans;
  if (!done) ans = '<div class="col" style="gap:5px;margin-top:8px">' + q.a.map((a, k) => '<button class="chbtn" data-a="panswer" data-c="' + k + '">' + a.t + '</button>').join('') + '</div>';
  else ans = '<div class="col" style="gap:6px;margin-top:8px"><div class="bub me">' + q.a[done.ci].t + '</div>' + (done.rep ? '<div class="muted" style="font-weight:800;font-size:12px">' + done.rep + '</div>' : '') + (done.sum.length ? '<div class="bub sum">' + done.sum.join(' · ') + '</div>' : '') + '<button class="btn pri" data-a="' + (cur < pr.qs.length - 1 ? 'pnext' : 'pend') + '">' + (cur < pr.qs.length - 1 ? 'Question suivante ▶' : 'Terminer la conférence ▶') + '</button></div>';
  return '<div class="md" style="max-width:640px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0;font-size:16px">🎙 Conférence de presse · ' + (cur + 1) + '/' + pr.qs.length + '</h3><span class="tag" style="background:#EAD3B0">Avant ' + T(pr.opp).name + '</span></div>' + bubble + ans + '</div>';
}
function ovPre() {
  const m = G.match, ot = T(m.opp), lu = G.lineup.map(P).filter(Boolean);
  const nm = nextMy(), left = (nm ? nm.day : G.day) - G.day, u = teamStr(1, 1), warn = [];
  lu.filter((p) => p.fat > 70).forEach((p) => warn.push(p.name + ' est fatigué'));
  lu.filter((p) => p.moral < 40).forEach((p) => warn.push(p.name + ' est frustré'));
  G.players.filter((p) => p.promise && G.lineup.indexOf(p.id) < 0 && avail(p)).forEach((p) => warn.push('Tu as promis la titularisation à ' + p.name));
  void left; void u;
  const chips = lu.map((p) => '<div class="row" style="gap:5px;background:var(--paper);border:1.5px solid var(--line2);border-radius:10px;padding:2px 6px">' + headH(p, 24) + '<b style="font-size:11.5px">' + p.name + '</b><b style="margin-left:auto;color:' + col(rate(p)) + '">' + rate(p) + '</b></div>').join('');
  return '<div class="md" style="max-width:680px"><div class="row" style="justify-content:center;gap:16px;margin:2px 0 4px">' + badge(ME, 50) + '<div style="text-align:center"><div class="tag" style="background:' + (m.kind === 'L' ? DIVS[myDiv()].col : '#F0C253') + '">' + (m.kind === 'L' ? DIVS[myDiv()].n + ' · J' + (m.r + 1) : 'Coupe du Roi · ' + CUPR[m.r]) + '</div><div style="font-size:24px;font-weight:800">JOUR DE MATCH</div><div class="muted" style="font-weight:800;font-size:12px">' + (m.home ? 'À domicile' : m.neutral ? 'Terrain neutre' : 'À l’extérieur') + ' · ' + T(ME).name + ' vs ' + ot.name + '</div></div>' + badge(m.opp, 50) + '</div>' +
    '<div class="row" style="gap:5px;flex-wrap:wrap;margin:6px 0">' + [G.formation.slice(2), MENT[G.ment].n, 'Penaltys : ' + (P(G.penTaker) ? P(G.penTaker).name : '—'), 'Capitaine : ' + (P(G.captain) ? P(G.captain).name : '—')].map((t) => '<span class="tag" style="background:#EAD3B0">' + t + '</span>').join('') + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">' + chips + '</div>' +
    (warn.length ? '<div style="margin-top:6px;background:#F3E0B0;border-radius:10px;padding:5px 9px;font-weight:800;font-size:12px">⚠ ' + warn.join(' · ') + '</div>' : '') +
    '<div class="row" style="gap:8px;margin-top:8px"><button class="btn grow" data-a="edit">Modifier la compo</button><button class="btn pri grow" data-a="kick" style="font-size:15px">⚽ Lancer le match</button></div></div>';
}
function ovMatch() {
  const ot = T(M.opp), mine = M.home;
  const bx = M.ball === 'U' ? 14 : M.ball === 'O' ? -14 : 0, by = 12 + (M.b * 37 % 76);
  const tk = [];
  tokenPos().forEach((q, i) => { const p = P(M.mine[i]); const a = pitchPt(clamp(q[0] * 0.5 + bx * 0.35, 3, 97), q[1]); tk.push({ x: a.x, y: a.y, s: a.s, c: i === 0 ? ['#5E7A5A', '#2F4A2E'] : teamCol(ME), sk: p ? p.look.skin : null }); const b = pitchPt(clamp(100 - q[0] * 0.5 + bx * 0.35, 3, 97), 100 - q[1]); tk.push({ x: b.x, y: b.y, s: b.s, c: i === 0 ? ['#8A8F98', '#4B4F57'] : teamCol(M.opp), sk: null }); });
  tk.sort((a, b2) => a.y - b2.y);
  const bp = pitchPt(clamp(50 + bx * 2.2, 8, 92), by), ballO = { x: bp.x, y: bp.y };
  const bg = mine ? stadiumSvg(myStadium({ id: 'mt', fill: clamp(M.att / CAPS[G.fac.cap], 0.15, 1), night: G.fac.lights > 0 && M.b > 10, on: G.fac.lights > 0, score: M.sc[0] + '-' + M.sc[1], tok: tk, ball: ballO })) : stadiumSvg({ id: 'aw', pitch: '#7FA077', ps: 'stripes', seat: teamCol(M.opp)[0], seat2: teamCol(M.opp)[1], cap: M.neutral ? 5 : clamp(5 - ot.div, 2, 4), vip: M.neutral ? 2 : 0, lights: ot.div < 2 || M.neutral ? 2 : 0, pq: 3, fill: M.neutral ? 0.95 : 0.7, name: M.neutral ? 'FINALE' : ot.short + ' ' + 'ARENA'.slice(0, 0), night: M.neutral, on: M.neutral, score: M.sc[0] + '-' + M.sc[1], tok: tk, ball: ballO });
  const hs = M.home ? [ME, M.opp] : [M.opp, ME], sc = M.home ? M.sc : [M.sc[1], M.sc[0]];
  const sb = '<div class="sbx">' + badge(hs[0], 26) + '<span class="s">' + sc[0] + '</span><span style="font-weight:800;font-size:12px;min-width:34px;text-align:center">' + (M.over ? 'FIN' : M.min + '\'') + '</span><span class="s">' + sc[1] + '</span>' + badge(hs[1], 26) + '</div>';
  const feed = '<div class="feed">' + M.feed.map((f) => '<div class="' + f.c + '">' + f.t + '</div>').join('') + '</div>';
  let ctrl;
  if (M.over) {
    const sc2 = {}; M.scorers.forEach((id) => { sc2[id] = (sc2[id] || 0) + 1; });
    const win = M.sc[0] > M.sc[1], draw = M.sc[0] === M.sc[1];
    const pen = M.pen ? ' · tirs au but ' + M.pen[0] + '-' + M.pen[1] : '';
    const lines = Object.keys(sc2).map((id) => P(id).name + (sc2[id] > 1 ? ' ×' + sc2[id] : '')).join(', ');
    ctrl = '<div class="card" style="background:' + (win || (draw && M.pen && M.pen[0] > M.pen[1]) ? '#D7E2CF' : draw ? '#F3E0B0' : '#F2D6D3') + '"><div style="font-size:18px;font-weight:800">' + (win ? 'Victoire' : draw ? (M.pen ? (M.pen[0] > M.pen[1] ? 'Qualifiés aux tirs au but' : 'Éliminés aux tirs au but') : 'Match nul') : 'Défaite') + ' ' + M.sc[0] + '-' + M.sc[1] + pen + '</div><div style="font-size:12px;font-weight:700">' + (lines ? 'Buteurs : ' + lines + '. ' : '') + (M.gate ? 'Recette : ' + fmt(M.gate) + '. ' : '') + '</div>' + (M.serious ? '<div style="margin-top:3px;font-weight:800;color:#C46A55">Blessure grave : ' + P(M.serious).name + ' est out ' + P(M.serious).inj + ' jours.</div>' : M.injured ? '<div style="margin-top:3px;font-weight:800;color:#C46A55">' + P(M.injured).name + ' est blessé.</div>' : '') + (M.kind === 'C' && M.winner !== null && M.r !== 4 ? '<div style="font-weight:800;margin-top:3px">' + (M.winner === ME ? 'On passe au tour suivant.' : 'Éliminés de la Coupe du Roi.') + '</div>' : '') + '<button class="btn pri" style="width:100%;margin-top:6px" data-a="after">Continuer ▶</button></div>';
  } else if (UI.ht) {
    ctrl = '<div class="card"><b>Mi-temps ' + M.sc[0] + '-' + M.sc[1] + '</b> · Causerie<div class="col" style="gap:4px;margin-top:5px"><button class="chbtn" data-a="ht" data-i="enc">Encourager : le milieu monte d’un cran</button><button class="chbtn" data-a="ht" data-i="push">Exiger plus : attaque +4, défense −2</button><button class="chbtn" data-a="ht" data-i="safe">Se resserrer : défense +4, attaque −3</button></div></div>';
  } else {
    ctrl = '<div class="row" style="gap:6px"><span class="muted" style="font-weight:800;font-size:11px">Vitesse</span><div class="seg" style="width:140px">' + [1, 2, 4].map((v) => '<button class="' + (UI.mspeed === v ? 'on' : '') + '" data-a="mspeed" data-i="' + v + '">×' + v + '</button>').join('') + '</div><button class="btn sm" data-a="skip" style="margin-left:auto">Passer ⏭</button></div>';
  }
  return '<div class="md" style="width:min(820px,100%);height:min(350px,100%);display:flex;gap:8px;padding:8px;overflow:hidden"><div style="flex:0 0 52%;position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#000">' + bg + sb + '</div><div class="col" style="flex:1;min-width:0"><div class="card" style="flex:1;min-height:0;overflow:auto;padding:6px">' + feed + '</div>' + ctrl + '</div></div>';
}
function ovSeason() {
  const h = G.lastRec, d = myDiv();
  return '<div class="md" style="max-width:520px;text-align:center"><div style="font-size:12px;font-weight:800" class="muted">FIN DE SAISON ' + h.season + '</div><div style="font-size:28px;font-weight:800;margin:2px 0">' + h.res + (h.res === 'Promu' ? ' !' : '') + '</div><div style="font-weight:800">' + DIVS[h.div].n + ' · ' + ordn(h.rank) + ' avec ' + h.pts + ' pts</div><div class="muted" style="font-weight:700;margin:4px 0">Coupe du Roi : ' + h.cup + ' · Prime : ' + fmt(h.prize) + '</div><div class="card" style="margin:6px 0;background:' + (h.obj ? '#D7E2CF' : '#F2D6D3') + ';font-weight:800">Objectif ' + (h.obj ? 'atteint' : 'manqué') + ' · Conseil ' + Math.round(G.board) + ' %</div><div style="font-weight:800;margin-bottom:6px">Saison ' + G.season + ' : ' + DIVS[d].n + '</div><button class="btn pri big" data-a="newseason">Lancer la saison ' + G.season + ' ▶</button></div>';
}
function ovTalk() {
  const p = P(UI.talk); if (!p) return '';
  const msg = UI.talkMsg;
  return '<div class="md" style="max-width:460px"><div class="row" style="gap:10px;align-items:flex-start"><div style="width:90px;height:100px;background:#F3E0B0;border-radius:12px;overflow:hidden;flex:none">' + bust(p) + '</div><div class="grow"><b style="font-size:16px">' + p.name + '</b><div class="muted" style="font-weight:800;font-size:11px">' + TRAITS[p.trait] + ' · ' + moodOf(p).label + ' · moral ' + Math.round(p.moral) + '</div><div style="font-weight:700;margin:5px 0;min-height:34px">' + (msg || 'Il t’écoute. Comment lui parler ?') + '</div></div></div>' + (p.talked === G.day || (p.talkDay && G.day - p.talkDay < 3) ? '<div class="muted" style="font-weight:800;margin:6px 0">Vous avez déjà parlé récemment.</div>' : '<div class="col" style="gap:5px;margin-top:6px"><button class="chbtn" data-a="tone" data-i="enc">Encourager : « Je crois en toi. »</button><button class="chbtn" data-a="tone" data-i="fer">Être franc : « Il faut en faire plus. »</button><button class="chbtn" data-a="tone" data-i="pro">Promettre : « Tu débuteras le prochain match. »</button></div>') + '<button class="btn" style="width:100%;margin-top:8px" data-a="closeov">Fermer</button></div>';
}

/* ---------- Runner ---------- */
function blockedRun() { return !!G.match; }
function runSim() {
  if (UI.run) return; if (blockedRun()) { UI.ov = 'pre'; renderOv(); return; }
  UI.ov = null; UI.run = true; render(); tick();
}
function tick() {
  if (!UI.run) return;
  const r = nextDay();
  if (r.stop) { UI.run = false; handleStop(r); return; }
  renderLite();
  LT = setTimeout(tick, 520 / UI.speed);
}
function handleStop(r) {
  if (r.stop === 'match') { UI.ov = 'pre'; }
  else if (r.stop === 'presser') { UI.ov = 'press'; UI.pq = 0; }
  else if (r.stop === 'msg') { UI.ov = 'msg'; UI.msgSel = r.m.id; }
  else if (r.stop === 'season') { UI.ov = 'season'; }
  render();
}
function pauseSim() { UI.run = false; clearTimeout(LT); render(); }
function liveTick() {
  if (!UI.live) return;
  if (M.b === 15 && !M.htDone) { M.htDone = true; UI.ht = true; renderOv(); return; }
  stepBlock();
  if (M.done) { applyResult(); UI.live = false; }
  renderOv();
  if (!M.over) LT = setTimeout(liveTick, 430 / UI.mspeed);
}

/* ---------- Actions ---------- */
const ACT = {
  rotok() { document.getElementById('rot').classList.remove('show'); },
  menu() { if (!UI.live) { UI.run = false; clearTimeout(LT); showLauncher(); } },
  nav(d) { UI.screen = d.i; render(); },
  sel(d) { UI.sel = d.i; render(); },
  flt(d) { UI.flt = d.i; render(); },
  ctab(d) { UI.ctab = d.i; render(); }, cdiv(d) { UI.cdiv = +d.i; render(); },
  club(d) { UI.club = d.i; render(); }, mk(d) { UI.mk = d.i; render(); },
  train(d) { G.train = d.i; render(); },
  speed(d) { UI.speed = +d.i; render(); },
  go() { runSim(); }, pause() { pauseSim(); },
  prematch() { UI.ov = 'pre'; renderOv(); },
  closeov() { UI.ov = null; render(); },
  resume() { UI.ov = null; runSim(); },
  openmsg(d) { UI.ov = 'msg'; UI.msgSel = d.i || (G.inbox.find((m) => !m.info) || {}).id; const m = G.inbox.find((x) => x.id === UI.msgSel); renderOv(); void m; },
  msgsel(d) { UI.msgSel = d.i; renderOv(); },
  choose(d) { answerMsg(d.i, +d.c); render(); },
  panswer(d) { answerPress(UI.pq || 0, +d.c); renderOv(); },
  pnext() { UI.pq = (UI.pq || 0) + 1; renderOv(); },
  pend() { G.presser = null; UI.ov = null; UI.pq = 0; save(); runSim(); },
  edit() { UI.ov = null; UI.screen = 'tac'; render(); },
  kick() { startMatch(); UI.mspeed = UI.speed > 2 ? 2 : 1; UI.live = true; UI.ht = false; UI.ov = 'match'; renderOv(); LT = setTimeout(liveTick, 600); },
  mspeed(d) { UI.mspeed = +d.i; renderOv(); },
  skip() { clearTimeout(LT); UI.live = false; UI.ht = false; if (!M.htDone) M.htDone = true; if (!M.htm) M.htm = { a: 0, d: 0, m: 0 }; while (!M.done) stepBlock(); applyResult(); renderOv(); },
  ht(d) { M.htm = d.i === 'enc' ? { a: 2, d: 1, m: 4 } : d.i === 'push' ? { a: 4, d: -2, m: 1 } : { a: -3, d: 4, m: 0 }; if (d.i === 'enc') G.lineup.map(P).forEach((p) => { if (p) p.moral = clamp(p.moral + 2, 0, 100); }); UI.ht = false; M.feed.push({ t: 'Reprise de la seconde période.', c: '' }); renderOv(); LT = setTimeout(liveTick, 500); },
  after() { UI.ov = null; UI.live = false; M = null; render(); runSim(); },
  newseason() { UI.ov = null; render(); },
  /* effectif */
  talk(d) { UI.talk = d.i; UI.talkMsg = ''; UI.ov = 'talk'; renderOv(); },
  tone(d) { const p = P(UI.talk), tt = TALK[p.trait][d.i]; p.moral = clamp(p.moral + tt[0], 0, 100); p.talkDay = G.day; UI.talkMsg = tt[1].replace(/^Il /, p.name + ' ') + ' (' + (tt[0] > 0 ? '+' : '') + tt[0] + ' moral)'; if (d.i === 'pro') { p.promise = { t: 'start', until: G.day + 9 }; } renderOv(); render(); },
  capt(d) { applyFx([['captain', d.i]]); toast(P(d.i).name + ' est capitaine'); render(); },
  listp(d) { const p = P(d.i); p.listed = !p.listed; toast(p.listed ? p.name + ' mis en vente' : p.name + ' retiré de la vente'); render(); },
  /* tactique */
  tsel(d) { UI.tsel = UI.tsel === d.i ? null : d.i; if (UI.tsel && d.second) return; render(); },
  bench(d) { if (!UI.tsel) { toast('Touche d’abord un titulaire'); return; } const i = G.lineup.indexOf(UI.tsel); const p = P(d.i); if (!avail(p)) { toast(p.name + ' est indisponible'); return; } G.lineup[i] = d.i; UI.tsel = null; save(); render(); },
  auto() { G.lineup = []; fitLineup(); UI.tsel = null; toast('Meilleur onze placé'); save(); render(); },
  form(d) { G.formation = d.i; fitLineup(); render(); },
  ment(d) { G.ment = d.i; render(); },
  /* club */
  kit(d) { G.kit.c[+d.k] = d.i; render(); },
  kitstyle(d) { G.kit.s = d.i; render(); },
  look(d) { const s = staff(d.i), k = d.k, nx = (arr, v) => arr[(arr.indexOf(v) + 1) % arr.length]; if (k === 'hair') s.look.hair = nx(HAIR, s.look.hair); else if (k === 'hc') s.look.hc = nx(HCOL, s.look.hc); else if (k === 'skin') s.look.skin = nx(SKIN, s.look.skin); else s.look.beard = nx(['stubble', 'goatee', 'full', 'stache', undefined], s.look.beard); if (k === 'hc') s.look.bc = s.look.hc; save(); render(); },
  ustaff(d) { const e = upgradeStaff(d.i); toast(e || 'Staff amélioré'); render(); },
  stad(d) { G.stad[d.k] = d.i; save(); render(); },
  ufac(d) { const e = upgrade(d.i); toast(e || FAC[d.i].n + ' améliorée'); render(); },
  night() { UI.night = !UI.night; render(); },
  buy(d) { const e = buy(d.i); toast(e || 'Joueur signé'); render(); },
  sellnow(d) { const e = sellNow(d.i); toast(e || 'Joueur vendu'); render(); },
  reset() { if (UI.rst) { try { localStorage.removeItem(SAVE); } catch (e) { /* */ } newGame(); UI.rst = false; UI.screen = 'home'; render(); } else { UI.rst = true; toast('Touche encore pour tout effacer'); setTimeout(() => { UI.rst = false; }, 3000); } }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'tsel' && UI.tsel && UI.tsel !== el.dataset.i) { const i = G.lineup.indexOf(UI.tsel), j = G.lineup.indexOf(el.dataset.i); if (i >= 0 && j >= 0) { const t = G.lineup[i]; G.lineup[i] = G.lineup[j]; G.lineup[j] = t; UI.tsel = null; render(); return; } }
  if (ACT[a]) ACT[a](el.dataset, el);
});
document.addEventListener('change', (e) => {
  const s = e.target.dataset && e.target.dataset.sel; if (!s) return;
  if (s === 'pen') G.penTaker = e.target.value; else if (s === 'cap') G.captain = e.target.value;
  save(); render();
});

/* ---------- Init ---------- */
const hadSavedCareer = load();
if (!hadSavedCareer) newGame();
if (G.match) { UI.ov = null; }
UI.mspeed = 1;
render();
window.__dbg = { get G() { return G; }, get M() { return M; }, UI, ACT, render, nextDay, newGame };

/* ===== Launcher (menu principal) ===== */
let installPrompt = null;
const launcher = document.getElementById('launcher');
function showLauncher() {
  document.getElementById('launch-label').textContent = hadSavedCareer || G.season > 1 || G.day > 1 ? 'Reprendre ma carrière' : 'Entrer dans le club';
  document.getElementById('launch-save').textContent = 'Saison ' + G.season + ' · ' + DIVS[myDiv()].n + ' · ' + dateStr() + ' · Sauvegarde sur cet appareil';
  document.getElementById('launch-players').innerHTML = ['rafa','leo','yanis'].map(id => (P(id) ? '<div class="launch-player">' + chibi(pv(P(id)), 'full', 'happy') + '</div>' : '')).join('');
  launcher.hidden = false; app.hidden = true; ovl.hidden = true;
}
document.getElementById('launch-play').addEventListener('click', () => { launcher.hidden = true; app.hidden = false; ovl.hidden = false; render(); });
function launchHelp(kind) {
  const box = document.getElementById('launch-help');
  const same = box.dataset.kind === kind && !box.hidden;
  box.hidden = same; box.dataset.kind = kind;
  document.getElementById('launch-how').setAttribute('aria-expanded',String(!same && kind === 'how'));
  document.getElementById('launch-install').setAttribute('aria-expanded',String(!same && kind === 'install'));
  box.innerHTML = kind === 'how' ? '<p><strong>1. Fais avancer le temps</strong><br>Appuie sur Continuer. Les jours passent tout seuls.</p><p><strong>2. Réponds quand on t’écrit</strong><br>Un joueur ou ton staff peut t’écrire. La simulation s’arrête et tu choisis.</p><p><strong>3. Joue les matchs</strong><br>Prépare ta compo, puis les joueurs jouent seuls. Monte les 4 divisions et gagne la Coupe du Roi.</p' : '<p><strong>iPhone / iPad</strong><br>Ouvre ce lien dans Safari → Partager → Sur l’écran d’accueil.</p><p><strong>Android</strong><br>Dans Chrome, ouvre le menu ⋮ → Installer l’application ou Ajouter à l’écran d’accueil.</p><p>Ta carrière reste enregistrée dans ce navigateur. Utilise le même lien pour la retrouver.</p>';
}
document.getElementById('launch-how').addEventListener('click',()=>launchHelp('how'));
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();installPrompt=e;});
document.getElementById('launch-install').addEventListener('click',async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;}else launchHelp('install');});
document.getElementById('launch-fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen();else{launchHelp('install');}}catch{launchHelp('install');}});
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
showLauncher();

</script>
</body>
