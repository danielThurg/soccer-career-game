<div id="app"></div>
<main id="launcher" class="launcher" aria-label="Menu principal">
 <section class="launch-copy"><p class="launch-kicker">LE FOOT, À TA FAÇON · 7 CONTRE 7</p><h1 class="launch-title">SOCCER<span>CAREER</span></h1><p class="launch-tag">Ton club. Ton histoire.</p><p class="launch-desc">Prépare ton équipe, révèle ses talents et mène Nordville jusqu’au titre.</p><button class="launch-play" id="launch-play"><span id="launch-label">Entrer dans le club</span><span aria-hidden="true">→</span></button><p class="launch-save" id="launch-save"></p><div class="launch-options"><button id="launch-how" aria-expanded="false">Comment jouer</button><button id="launch-install" aria-expanded="false">Installer le jeu</button><button id="launch-fullscreen">Plein écran</button></div><div id="launch-help" class="launch-help" hidden></div><p class="launch-footer">NORDVILLE · UNE ÉQUIPE, MILLE POSSIBILITÉS</p></section>
 <div class="launch-art" aria-hidden="true"><div class="launch-lines"></div><div class="launch-badge">★ NORDVILLE ATHLETIC</div><div class="launch-players" id="launch-players"></div><div class="launch-caption">À toi de jouer, coach.</div></div>
</main>
<script>
'use strict';
const INK = '#2B1D14';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const $ = (s) => document.querySelector(s);

/* ---------- Chibi SVG ---------- */
function chibi(p, mode, moodOverride) {
  const b = p.build, L = p.look, kit = p.kit || ['#C46A55', '#FFF0CD'];
  const mood = moodOverride || moodOf(p).mood;
  const hr = 20 + (b - 0.75) * 9, hy = 44, cx = 50, ry = 25;
  const tw = 15 + (b - 0.75) * 17;
  const hc = L.hc, sk = L.skin;
  let s = '';
  const st = 'stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
  if (L.hair === 'afro') s += '<circle cx="50" cy="' + (hy - 6) + '" r="' + (hr + 9) + '" fill="' + hc + '" ' + st + '/>';
  if (L.hair === 'long') s += '<path d="M' + (cx - hr - 3) + ' ' + (hy - 8) + ' Q' + (cx - hr - 7) + ' ' + (hy + 30) + ' ' + (cx - hr + 4) + ' ' + (hy + 36) + ' L' + (cx + hr - 4) + ' ' + (hy + 36) + ' Q' + (cx + hr + 7) + ' ' + (hy + 30) + ' ' + (cx + hr + 3) + ' ' + (hy - 8) + 'Z" fill="' + hc + '" ' + st + '/>';
  if (mode === 'full') {
    const legW = 10 + (b - 0.75) * 4;
    s += '<rect x="' + (cx - legW - 3) + '" y="124" width="' + legW + '" height="26" rx="4" fill="' + sk + '" ' + st + '/>';
    s += '<rect x="' + (cx + 3) + '" y="124" width="' + legW + '" height="26" rx="4" fill="' + sk + '" ' + st + '/>';
    s += '<rect x="' + (cx - legW - 3) + '" y="136" width="' + legW + '" height="14" rx="3" fill="' + kit[0] + '" ' + st + '/>';
    s += '<rect x="' + (cx + 3) + '" y="136" width="' + legW + '" height="14" rx="3" fill="' + kit[0] + '" ' + st + '/>';
    s += '<ellipse cx="' + (cx - legW / 2 - 3) + '" cy="152" rx="9" ry="4" fill="' + INK + '"/><ellipse cx="' + (cx + 3 + legW / 2) + '" cy="152" rx="9" ry="4" fill="' + INK + '"/>';
    const armW = 9 + (b - 0.75) * 4;
    s += '<rect x="' + (cx - tw - armW + 2) + '" y="88" width="' + armW + '" height="28" rx="5" fill="' + sk + '" ' + st + '/>';
    s += '<rect x="' + (cx + tw - 2) + '" y="88" width="' + armW + '" height="28" rx="5" fill="' + sk + '" ' + st + '/>';
    s += '<rect x="' + (cx - tw - armW + 2) + '" y="86" width="' + armW + '" height="11" rx="4" fill="' + kit[0] + '" ' + st + '/>';

  launcher.hidden = false; app.hidden = true;
}
document.getElementById('launch-play').addEventListener('click', () => { launcher.hidden = true; app.hidden = false; render(); document.querySelector('.menu-button').focus(); });
function launchHelp(kind) {
  const box = document.getElementById('launch-help');
  const same = box.dataset.kind === kind && !box.hidden;
  box.hidden = same; box.dataset.kind = kind;
  document.getElementById('launch-how').setAttribute('aria-expanded',String(!same && kind === 'how'));
  document.getElementById('launch-install').setAttribute('aria-expanded',String(!same && kind === 'install'));
  box.innerHTML = kind === 'how' ? '<p><strong>1. Prépare ton équipe</strong><br>Choisis tes 7 titulaires et ta formation dans Tactique.</p><p><strong>2. Fais grandir ton club</strong><br>Entraîne tes joueurs et parle-leur pour garder le moral.</p><p><strong>3. Joue le prochain match</strong><br>Les joueurs jouent seuls. À la mi-temps, ajuste tes consignes.</p>' : '<p><strong>iPhone / iPad</strong><br>Ouvre ce lien dans Safari → Partager → Sur l’écran d’accueil.</p><p><strong>Android</strong><br>Dans Chrome, ouvre le menu ⋮ → Installer l’application ou Ajouter à l’écran d’accueil.</p><p>Ta carrière reste enregistrée dans ce navigateur. Utilise le même lien pour la retrouver.</p>';
}
document.getElementById('launch-how').addEventListener('click',()=>launchHelp('how'));
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();installPrompt=e;});
document.getElementById('launch-install').addEventListener('click',async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;}else launchHelp('install');});
document.getElementById('launch-fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen();else{launchHelp('install');}}catch{launchHelp('install');}});
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
showLauncher();
</script>
</body>
</html>
